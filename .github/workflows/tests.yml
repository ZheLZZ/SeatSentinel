name: Windows tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.lock
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-runtime.lock
      - name: Check release manifests
        run: python tools/validate_release.py
      - name: Check PowerShell and staged publication failure paths
        shell: powershell
        run: ./tools/test_release_helpers.ps1
      - name: Verify lightweight package contents
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./构建轻量版.ps1 -NoPause -OutputRoot dist/ci-light
      - name: Compile tracked Python files
        shell: pwsh
        run: |
          $sourceFiles = @(git ls-files '*.py')
          python -m py_compile $sourceFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
